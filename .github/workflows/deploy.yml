# How commits get served in prod.
#
# A push to `main` (or the hourly schedule, or a manual run) rebuilds the static site
# from LIVE prod data and deploys it to geoffery.gg. The site reads build-time JSON, so
# it only changes on a rebuild — `ops/run.sh prod publish` pulls the current prod D1 into
# a snapshot, regenerates that JSON, builds, and deploys via wrangler.
#
# The cron/HTTP Workers (collector, aggregator, scorer, news, consult) are deployed
# deliberately — NOT on every commit — so a code push never interrupts the data pipeline.
# Tick the "deploy-workers" box on a manual run to (re)deploy them.
#
# Required repo secrets: CLOUDFLARE_API_TOKEN (scopes: Pages, Workers Scripts, D1, R2),
# CLOUDFLARE_ACCOUNT_ID, GEOFFERY_ZONE. Once AdSense is approved, add PUBLIC_ADSENSE_CLIENT
# and the three PUBLIC_ADSENSE_SLOT_* secrets to turn ads on at the next deploy.
name: Deploy to prod

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "packages/**"
      - "ops/**"
      - "workers/**"
      - ".github/workflows/deploy.yml"
  schedule:
    - cron: "17 * * * *" # hourly — republish so live prices stay fresh
  workflow_dispatch:
    inputs:
      deploy-workers:
        description: "Also (re)deploy the cron/HTTP Workers"
        type: boolean
        default: false

# Never let two prod deploys race; let an in-flight one finish.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEOFFERY_ZONE: ${{ secrets.GEOFFERY_ZONE }}
      # Build-time ad config — empty until AdSense is approved (site stays ad-dormant).
      PUBLIC_ADSENSE_CLIENT: ${{ secrets.PUBLIC_ADSENSE_CLIENT }}
      PUBLIC_ADSENSE_SLOT_ITEM_MID: ${{ secrets.PUBLIC_ADSENSE_SLOT_ITEM_MID }}
      PUBLIC_ADSENSE_SLOT_ITEM_BOTTOM: ${{ secrets.PUBLIC_ADSENSE_SLOT_ITEM_BOTTOM }}
      PUBLIC_ADSENSE_SLOT_MOBILE: ${{ secrets.PUBLIC_ADSENSE_SLOT_MOBILE }}
    steps:
      # Stay green (no-op) until the Cloudflare secrets exist, so the hourly schedule
      # doesn't fail before prod is provisioned + secrets are added.
      - name: Check Cloudflare config is present
        id: cfg
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::Cloudflare secrets not set — skipping deploy. Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and GEOFFERY_ZONE as repo secrets to enable."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history so the deploy regression guard can check commit ancestry
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.cfg.outputs.ready == 'true'
        run: npm ci
      - name: Publish — build from live prod data, then deploy the site
        if: steps.cfg.outputs.ready == 'true'
        run: bash ops/run.sh prod publish
      - name: Deploy Workers (manual runs only, when requested)
        if: ${{ steps.cfg.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.deploy-workers }}
        run: bash ops/run.sh prod deploy-workers
