<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tip jar">
  <!-- House-drawn OSRS-inspired tip jar (D-DESIGN-001 temperature; no game assets).
       A glazed clay jar holding gold coins, in the house palette. -->
  <!-- jar body -->
  <path d="M16 22 C12 30 12 46 18 54 C22 59 42 59 46 54 C52 46 52 30 48 22 Z"
        fill="#8a6a4a" stroke="#5a4a33" stroke-width="2.5"/>
  <!-- glaze highlight -->
  <path d="M19 26 C17 33 17 44 21 51" fill="none" stroke="#bda687" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <!-- rim -->
  <rect x="14" y="16" width="36" height="8" rx="3" fill="#6d573d" stroke="#5a4a33" stroke-width="2.5"/>
  <!-- coins spilling at the mouth -->
  <ellipse cx="26" cy="15" rx="6" ry="3.4" fill="#c8a44d" stroke="#8a6a21" stroke-width="2"/>
  <ellipse cx="38" cy="13" rx="6" ry="3.4" fill="#d9b75f" stroke="#8a6a21" stroke-width="2"/>
  <ellipse cx="32" cy="10" rx="6" ry="3.4" fill="#c8a44d" stroke="#8a6a21" stroke-width="2"/>
  <!-- coin slot gleam -->
  <ellipse cx="32" cy="9.4" rx="3" ry="1.2" fill="#ecd28a"/>
  <!-- one coin by the foot -->
  <ellipse cx="50" cy="57" rx="5" ry="2.8" fill="#c8a44d" stroke="#8a6a21" stroke-width="2"/>
</svg>
