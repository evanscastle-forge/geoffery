# ops/wrangler/collector.toml — live price ingestion (cron, spec §3).
# Bindings: D1 (hot window) + R2 (the irreplaceable archive). Cron every 5 min.
#
# account_id is read from $CLOUDFLARE_ACCOUNT_ID (sourced by run.sh from
# env/.env.<target>), so it is NOT hard-coded here. The *resource* ids below are
# per-environment and must be filled with the values `wrangler d1 create` /
# `wrangler r2 bucket create` print — search for REPLACE_ to find them all.
name = "geoffery-collector"
main = "../../workers/collector/src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# ── dev: dev.geoffery.gg ────────────────────────────────────────────────────
[env.dev]
name = "geoffery-collector-dev"
# dev runs no cron — the free plan allows 5 triggers/account and prod's 4 take priority
# (2026-06-18). Run the pipeline locally for dev smoke; restore by going Workers Paid.
triggers.crons = []
vars = { GEOFFERY_DEPLOYMENT_NAME = "dev", GEOFFERY_USER_AGENT = "Geoffery dev (evanscastle.forge@gmail.com)" }

[[env.dev.d1_databases]]
binding = "DB"
database_name = "geoffery-dev"
database_id = "2df02cda-965b-4f08-b78a-12cdf7ecbe13"

[[env.dev.r2_buckets]]
binding = "ARCHIVE"
bucket_name = "geoffery-archive-dev"

# ── prod: geoffery.gg ───────────────────────────────────────────────────────
[env.prod]
name = "geoffery-collector-prod"
triggers.crons = ["*/5 * * * *"]
vars = { GEOFFERY_DEPLOYMENT_NAME = "prod", GEOFFERY_USER_AGENT = "Geoffery (evanscastle.forge@gmail.com)" }

[[env.prod.d1_databases]]
binding = "DB"
database_name = "geoffery-prod"
database_id = "6d9b40d7-a91d-4874-9a85-4c364e216d0c"

[[env.prod.r2_buckets]]
binding = "ARCHIVE"
bucket_name = "geoffery-archive-prod"
