# ops/wrangler/scorer.toml — score closed consultations, rebuild calibration
# (cron, spec §2.6). D1 only. Cron every 30 min.
name = "geoffery-scorer"
main = "../../workers/scorer/src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[env.dev]
name = "geoffery-scorer-dev"
# dev runs no cron — free-plan 5-trigger/account cap, prod's crons take priority (2026-06-18).
triggers.crons = []
vars = { GEOFFERY_DEPLOYMENT_NAME = "dev" }

[[env.dev.d1_databases]]
binding = "DB"
database_name = "geoffery-dev"
database_id = "2df02cda-965b-4f08-b78a-12cdf7ecbe13"

[env.prod]
name = "geoffery-scorer-prod"
# prod cron off (2026-08-25) — parked with the rest of the pipeline for the D1
# free-tier shutdown; its own load is negligible (~10k rows read/day) and it has
# nothing to score while the collector is stopped. Restore with
# triggers.crons = ["*/30 * * * *"].
triggers.crons = []
vars = { GEOFFERY_DEPLOYMENT_NAME = "prod" }

[[env.prod.d1_databases]]
binding = "DB"
database_name = "geoffery-prod"
database_id = "6d9b40d7-a91d-4874-9a85-4c364e216d0c"
