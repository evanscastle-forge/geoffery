<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Members item">
  <!-- House-style members star (D-DESIGN-001 temperature; no game assets).
       GOLD = members. A faceted five-point star in the house brass palette, with a
       dark brass outline so it holds on parchment cards AND a bright core so it holds
       on the dark page. Sized ~0.9-1em inline; see local/feedback-round brief. -->
  <title>Members item</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.5" stop-color="#d9b75f"/>
      <stop offset="1" stop-color="#c8a44d"/>
    </linearGradient>
  </defs>
  <path d="M12 1.6 L14.95 8.1 L22 8.9 L16.8 13.7 L18.25 20.7 L12 17.1 L5.75 20.7 L7.2 13.7 L2 8.9 L9.05 8.1 Z"
        fill="url(#gold)" stroke="#8a6a21" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- inner facet highlight (gives the low-poly gleam) -->
  <path d="M12 1.6 L14.95 8.1 L12 9.4 Z" fill="#fbe9b0" opacity="0.85"/>
</svg>
