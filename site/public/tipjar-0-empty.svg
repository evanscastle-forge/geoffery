<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tip jar, empty">
  <!-- House-drawn tip jar, STATE 0 of 4 — EMPTY (D-DESIGN-001 temperature; no game
       assets). Same glazed clay jar as tipjar.svg; no coins. Demo: "how full is your
       tip jar". -->
  <title>Tip jar — empty</title>
  <!-- jar body -->
  <path d="M16 22 C12 30 12 46 18 54 C22 59 42 59 46 54 C52 46 52 30 48 22 Z"
        fill="#8a6a4a" stroke="#5a4a33" stroke-width="2.5"/>
  <!-- glaze highlight -->
  <path d="M19 26 C17 33 17 44 21 51" fill="none" stroke="#bda687" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <!-- empty interior shadow -->
  <path d="M19 24 C16 31 16 45 21 52 C24 56 40 56 43 52 C48 45 48 31 45 24 Z"
        fill="#6d573d" opacity="0.45"/>
  <!-- rim -->
  <rect x="14" y="16" width="36" height="8" rx="3" fill="#6d573d" stroke="#5a4a33" stroke-width="2.5"/>
  <!-- dark mouth opening -->
  <ellipse cx="32" cy="18" rx="14" ry="3.6" fill="#3c3020"/>
</svg>
