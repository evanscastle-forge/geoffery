<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tip jar, overflowing">
  <!-- House-drawn tip jar, STATE 3 of 4 — OVERFLOWING, coins spilling over the lip
       and onto the surface (D-DESIGN-001 temperature; no game assets). -->
  <title>Tip jar — overflowing</title>
  <!-- jar body -->
  <path d="M16 22 C12 30 12 46 18 54 C22 59 42 59 46 54 C52 46 52 30 48 22 Z"
        fill="#8a6a4a" stroke="#5a4a33" stroke-width="2.5"/>
  <!-- glaze highlight -->
  <path d="M19 26 C17 33 17 44 21 51" fill="none" stroke="#bda687" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <!-- coins spilled onto the surface at the foot -->
  <ellipse cx="12" cy="57" rx="5.5" ry="3.1" fill="#c8a44d" stroke="#8a6a21" stroke-width="2"/>
  <ellipse cx="52" cy="57" rx="5.5" ry="3.1" fill="#d9b75f" stroke="#8a6a21" stroke-width="2"/>
  <ellipse cx="20" cy="59" rx="5.5" ry="3.1" fill="#d9b75f" stroke="#8a6a21" stroke-width="2"/>
  <ellipse cx="45" cy="59" rx="5.5" ry="3.1" fill="#c8a44d" stroke="#8a6a21" stroke-width="2"/>
  <!-- coins filling the jar -->
  <ellipse cx="26" cy="46" rx="6" ry="3.4" fill="#c8a44d" stroke="#8a6a21" stroke-width="2"/>
  <ellipse cx="38" cy="46" rx="6" ry="3.4" fill="#d9b75f" stroke="#8a6a21" stroke-width="2"/>
  <ellipse cx="32" cy="40" rx="6" ry="3.4" fill="#c8a44d" stroke="#8a6a21" stroke-width="2"/>
  <ellipse cx="24" cy="36" rx="6" ry="3.4" fill="#d9b75f" stroke="#8a6a21" stroke-width="2"/>
  <ellipse cx="40" cy="36" rx="6" ry="3.4" fill="#c8a44d" stroke="#8a6a21" stroke-width="2"/>
  <!-- rim -->
  <rect x="14" y="16" width="36" height="8" rx="3" fill="#6d573d" stroke="#5a4a33" stroke-width="2.5"/>
  <!-- coins mounded above and spilling over the lip -->
  <ellipse cx="22" cy="16" rx="6" ry="3.4" fill="#c8a44d" stroke="#8a6a21" stroke-width="2"/>
  <ellipse cx="42" cy="15" rx="6" ry="3.4" fill="#d9b75f" stroke="#8a6a21" stroke-width="2"/>
  <ellipse cx="32" cy="11" rx="6" ry="3.4" fill="#c8a44d" stroke="#8a6a21" stroke-width="2"/>
  <ellipse cx="27" cy="7" rx="6" ry="3.4" fill="#d9b75f" stroke="#8a6a21" stroke-width="2"/>
  <ellipse cx="38" cy="8" rx="6" ry="3.4" fill="#c8a44d" stroke="#8a6a21" stroke-width="2"/>
  <!-- topmost coin gleam -->
  <ellipse cx="32" cy="10.4" rx="3" ry="1.2" fill="#ecd28a"/>
</svg>
