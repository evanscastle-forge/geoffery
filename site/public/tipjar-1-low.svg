<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tip jar, nearly empty">
  <!-- House-drawn tip jar, STATE 1 of 4 — NEARLY EMPTY, a few coins at the bottom
       (D-DESIGN-001 temperature; no game assets). -->
  <title>Tip jar — nearly empty</title>
  <!-- jar body -->
  <path d="M16 22 C12 30 12 46 18 54 C22 59 42 59 46 54 C52 46 52 30 48 22 Z"
        fill="#8a6a4a" stroke="#5a4a33" stroke-width="2.5"/>
  <!-- glaze highlight -->
  <path d="M19 26 C17 33 17 44 21 51" fill="none" stroke="#bda687" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <!-- a few coins resting at the bottom -->
  <ellipse cx="26" cy="50" rx="6" ry="3.4" fill="#c8a44d" stroke="#8a6a21" stroke-width="2"/>
  <ellipse cx="38" cy="51" rx="6" ry="3.4" fill="#d9b75f" stroke="#8a6a21" stroke-width="2"/>
  <ellipse cx="32" cy="47" rx="6" ry="3.4" fill="#c8a44d" stroke="#8a6a21" stroke-width="2"/>
  <!-- rim -->
  <rect x="14" y="16" width="36" height="8" rx="3" fill="#6d573d" stroke="#5a4a33" stroke-width="2.5"/>
  <!-- dark mouth opening -->
  <ellipse cx="32" cy="18" rx="14" ry="3.6" fill="#3c3020"/>
</svg>
